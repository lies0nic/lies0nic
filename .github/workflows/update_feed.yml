name: Auto-update Podcast Feed & Chapters

on:
  schedule:
    # Run every Friday at 16:00 UTC (after typical PRISMATIC episode release)
    - cron: '0 16 * * 5'
    # Run every Saturday at 10:00 UTC (catch-up if Friday release was delayed)
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regenerate all chapters and descriptions'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3'

      - name: Run update script
        run: python scripts/update_feed.py ${{ inputs.force && '--force' || '' }}

      - name: Check for changes and commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing and pushing..."
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(feed): auto-update RSS feed & chapters"
            git push
          else
            echo "No changes detected. Feed is up to date."
          fi

      - name: Stage published files
        run: |
          mkdir -p _site
          cp feed.xml episode-*-chapters.json _site/
          echo "Published content:"
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
